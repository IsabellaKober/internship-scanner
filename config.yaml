# ---------------------------------------------------------------- language
language:
  english_markers: [working language is english, "working language: english",
    english-speaking, english speaking environment, fluent english,
    fluency in english, english is our working language, international team,
    anglais courant, anglais professionnel, langue de travail est l'anglais]
  scores: {english: 100, french: 60, german: 60, unknown: 60}

# ---------------------------------------------------------------- clarity
clarity:
  action_verbs: [analyze, analyse, analyser, build, construire, create, creer,
    prepare, preparer, elaborer, develop, developper, manage, gerer, piloter,
    lead, drive, conduct, mener, design, concevoir, launch, lancer, optimize,
    optimiser, monitor, suivre, present, presenter, produce, produire, model,
    modeliser, identify, identifier, negotiate, negocier, support, own, map,
    benchmark, structure, structurer, deliver, livrer, track, report]
  team_markers: [reporting to, report to, you will report, rattache, rattachee,
    au sein de l'equipe, within the, you will join, vous rejoindrez,
    sous la responsabilite, under the supervision, manager, mentor, tuteur,
    tutrice, head of, directeur, directrice]
  tools: [excel, powerpoint, google sheets, sql, python, tableau, power bi,
    looker, salesforce, hubspot, notion, figma, bloomberg, capital iq, pitchbook,
    factset, sap, vba, crm, jira, amplitude, google analytics, metabase]
  kpi_markers: [kpi, kpis, okr, okrs, objectives, objectifs, target, targets,
    quota, pipeline, revenue, chiffre d'affaires, conversion, deliverable,
    deliverables, livrable, livrables, roi, arr, mrr, nps, churn, growth rate]
  vague_phrases: [missions variees, various projects, divers projets,
    projets varies, support the team, assist the team, soutien a l'equipe,
    taches diverses, ad hoc, ad-hoc, other tasks, autres missions,
    toute autre mission, various tasks, polyvalent, polyvalente]

# ---------------------------------------------------------------- score
weights:            # must add up to 1.0
  role: 0.45        # target function + how much you LEARN (tasks, exposure, no grunt work)
  company: 0.30     # target sector + how well known the company is (tier)
  clarity: 0.10     # concrete, well-described mission
  dates: 0.10       # stated dates inside 1 May - 31 Jul 2027 (not stated = neutral)
  language: 0.05

# ---------------------------------------------------------------- outputs
notifications:
  min_score: 75                  # "top tier": only new offers >= this get a push
  max_per_run: 10                # safety cap

dashboard:
  new_badge_days: 3              # "NEW" tag for offers first seen in the last N days
  keep_unlisted_days: 60         # keep offers that disappeared, flagged "No longer listed"

enrichment:
  model: claude-haiku-5-5        # only used if ANTHROPIC_API_KEY is set
  max_per_run: 60                # cost guard
  max_description_chars: 15000

# "Search elsewhere" links (LinkedIn, Indeed, Welcome to the Jungle).
search_links:
  roles: ["private equity", "venture capital", "M&A", "asset management", "strategy",
    "business development", "corporate finance", "founder's associate"]

# ---------------------------------------------------------------- sources
sources:
  ats: {enabled: true}
  smartrecruiters:
    enabled: true
    ignore_robots: false         # robots.txt blocks bots -> off unless you set true
  adzuna:
    enabled: true                # runs only when ADZUNA_APP_ID/KEY secrets exist
    # targeted searches: one per target function / sector (generic "stage"
    # searches mostly returned off-target offers)
    queries: ["stage private equity", "stage capital investissement",
      "stage venture capital", "stage M&A", "stage fusions acquisitions",
      "stage corporate finance", "stage asset management", "stage gestion d'actifs",
      "stage analyste investissement", "stage equity research",
      "stage risk management", "stage strategie", "stage strategy",
      "stage business development", "stage startup", "stage chief of staff",
      "stage founder associate", "stage conseil en strategie", "stage financial analyst",
      "summer internship", "stage analyste financier", "internship"]
    distance_km: 15              # around Paris
    max_days_old: 30
    max_pages: 2                 # x 50 results per query
  francetravail:
    enabled: true                # runs only when FT_CLIENT_ID/SECRET secrets exist
    keywords: [stage, stagiaire, internship]
    departements: ["75", "92", "93", "94"]


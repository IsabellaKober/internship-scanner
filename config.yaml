# =====================================================================
#  Internship scanner — all settings live here. Edit on github.com
#  (pencil icon) and commit; the next run uses the new values.
#  Keywords are matched case- and accent-insensitively, as whole words.
# =====================================================================

# Private repo holding your statuses & notes (synced across devices).
# Left empty on purpose (this file is public): type "<username>/internship-scanner-state"
# once per device in the dashboard's Settings instead.
state_repo: ""

# ---------------------------------------------------------------- dates
dates:
  ideal_start: 2027-05-01
  ideal_end: 2027-07-31          # offers whose stated dates fit 1 May - 31 Jul rank highest
  earliest_start: 2027-04-20     # start before this  -> hidden
  latest_start: 2027-06-30       # start after this   -> hidden
  max_months: 3                  # stated duration longer than this -> hidden...
  top_role_max_months: 4         # ...except TOP roles (core function, role score >= below):
  top_role_min_score: 80         #    up to 4 months is shown, tagged "4-month internship"
  # phrases that mean "long internship" -> hidden unless a duration <= max_months
  # is also stated
  long_phrases: ["cesure", "gap year", "stage de cesure"]
  hide_end_of_studies: true      # "stage de fin d'etudes" (usually 6 months)
  boost_months: [2, 3]           # explicit 2-3 month internships get a boost
  boost_start_months: [4, 5]     # start in April / May get a boost

# ---------------------------------------------------------------- location
location:
  # postal-code prefixes and place names that are accepted
  postal_prefixes: ["75", "92", "93", "94"]
  places: [paris, la defense, puteaux, courbevoie, nanterre, boulogne-billancourt,
    boulogne, issy-les-moulineaux, neuilly-sur-seine, levallois-perret, levallois,
    clichy, rueil-malmaison, suresnes, montrouge, malakoff, vanves, clamart,
    meudon, sevres, saint-cloud, colombes, asnieres-sur-seine, gennevilliers,
    bagneux, chatillon, antony, sceaux, bois-colombes, la garenne-colombes,
    chaville, garches, saint-denis, la plaine saint-denis, saint-ouen,
    saint-ouen-sur-seine, montreuil, aubervilliers, pantin, bagnolet, les lilas,
    noisy-le-grand, bobigny, romainville, rosny-sous-bois, ivry-sur-seine,
    vincennes, saint-mande, charenton-le-pont, creteil, vitry-sur-seine,
    gentilly, arcueil, cachan, le kremlin-bicetre, kremlin-bicetre, villejuif,
    maisons-alfort, saint-maur-des-fosses, nogent-sur-marne,
    fontenay-sous-bois, rungis, joinville-le-pont, alfortville, hauts-de-seine,
    seine-saint-denis, val-de-marne]
  # generic "Ile-de-France" / "Greater Paris" is kept but tagged "Check location"
  unclear_places: [ile-de-france, idf, greater paris, region parisienne, paris region]
  exclude_remote_only: true

# ---------------------------------------------------------------- contract
contract:
  internship_terms: [stage, stagiaire, intern, internship, interns, praktikum,
    summer analyst, summer associate, off-cycle, off cycle, "stage h/f",
    "stage f/h"]
  exclude_terms: [alternance, alternant, alternante, apprentissage, apprenti,
    apprentie, apprentice, apprenticeship, work-study, work study, cdi, cdd,
    freelance, freelancer, v.i.e, volontariat international,
    "contrat pro", contrat de professionnalisation, permanent, full-time permanent,
    werkstudent, working student, these, phd, cifre, graduate programme,
    graduate program]

# ---------------------------------------------------------------- workplace
# School rule: the internship must be FULLY on-site. Hybrid / remote -> hidden.
workplace:
  exclude_hybrid: true
  # job-board "workplace type" shown next to the location, e.g. "Paris (Hybrid)"
  location_terms: [hybrid, hybride, remote, teletravail, fully]
  hybrid_phrases: [hybrid, hybride, teletravail, tele-travail, remote work,
    remote working, remote-friendly, remote friendly, remote-first, remote first,
    remote days, days remote, day remote, remote day, remote policy, full remote,
    fully remote, partial remote, partially remote, remote possible,
    jours de remote, jour de remote, home office, work from home, working from home,
    wfh, travail a distance, flex office, flexible remote, days in the office,
    days per week in the office, jours au bureau, jours sur site]
  negations: [pas de, "no", not, non, sans, aucun, aucune, without, zero]
  onsite_phrases: [100% on-site, 100% onsite, fully on-site, fully onsite,
    full on-site, 100% presentiel, 100 % presentiel, 5 days a week in the office,
    5 days in the office, 5 jours sur site, 5 jours par semaine au bureau]

# ---------------------------------------------------------------- eligibility
# Hide offers reserved for final-year or Master's students (must be open to 2nd years).
eligibility:
  hide_final_year_or_masters_only: true
  final_year_phrases: [final year, final-year, last year of your, last year of their,
    last year of a, last year of study, last year of studies, derniere annee,
    fin de cursus, graduating in 2026, graduating in 2027, class of 2026,
    class of 2027, recent graduate, recent graduates, recently graduated,
    jeune diplome, jeune diplomee, jeunes diplomes]
  masters_phrases: [master's student, masters student, master student,
    master students, master's students, student in a master, students in a master,
    enrolled in a master, enrolled in a master's, pursuing a master, pursuing a master's,
    currently in a master, master's degree student, msc student, mba student,
    mba students, graduate student, graduate students, postgraduate, post-graduate,
    etudiant en master, etudiante en master, en master,
    master 1, master 2, m1, m2, bac+4, bac+5, bac +4, bac +5, bac + 4, bac + 5,
    bac+5 minimum, grande ecole]
  # any of these keeps the offer: it is open to earlier years
  year_open_phrases: [avant-derniere annee, avant-derniere, avant derniere,
    penultimate year, penultimate, pre-final year, 2nd year, second year, 2eme annee, deuxieme annee, 2e annee,
    1st year, first year, any year, all years, toutes annees, l2, bac+2, bac +2,
    bac + 2, 3rd year, third year, 3eme annee, troisieme annee]
  bachelor_open_phrases: [bachelor student, bachelor students, bachelor's student,
    bachelor's students, bachelor or master, bachelor's or master's, bachelor/master,
    bachelors or masters, undergraduate, undergraduates, licence, l3, bac+3, bac +3,
    bac + 3]

# ---------------------------------------------------------------- pay
pay:
  min_monthly_eur: 1000          # stated pay below this -> hidden
  legal_minimum_counts_as_low: true   # "gratification legale" (~670 EUR) -> hidden

# ---------------------------------------------------------------- relevance
# An offer is shown only if BOTH gates pass (scanner/relevance.py):
#  1. COMPANY in a target sector (start-up / fintech, VC, private equity,
#     asset management, M&A / banking, insurance, consulting). Large
#     corporates outside these sectors: only strategy / investment / finance roles.
#  2. ROLE names a target function. Engineering, quant and marketing roles
#     (and support, HR, legal, admin) are hidden everywhere.
# Then the score rewards famous companies and roles where you actually LEARN.
relevance:
  sectors:
    fintech:          {label: Fintech, target: true}
    startup:          {label: Start-up, target: true}
    vc:               {label: Venture capital, target: true}
    private_equity:   {label: Private equity, target: true}
    asset_management: {label: Asset management, target: true}
    investment_bank:  {label: M&A / Investment banking, target: true}
    bank:             {label: Banking, target: true}
    insurance:        {label: Insurance / Risk, target: true}
    consulting:       {label: Consulting, target: true}
    corporate:        {label: Large corporate, target: false,
                       allowed_functions: [investment, strategy, consulting, finance]}

  # company fame / exposure: tier 1 = household name in its field,
  # 2 = well known, 3 = smaller, 4 = unknown company recognised from the offer text
  tier_scores: {1: 100, 2: 85, 3: 70, 4: 55}

  # Unknown companies (Adzuna / France Travail): sector recognised from the
  # offer text. No hit -> hidden.
  sector_keywords:
    vc: [venture capital, capital-risque, capital risque, fonds de capital-risque,
      vc fund, fonds vc, seed fund, fonds d'amorcage, early-stage investor,
      early stage investor, business angels, venture studio, start-up studio,
      startup studio]
    private_equity: [private equity, capital-investissement, capital investissement,
      fonds d'investissement, investment fund, investment firm, buyout, mid-cap,
      small-cap, growth equity, capital-developpement, capital developpement,
      capital-transmission, private debt, dette privee, infrastructure fund,
      family office]
    asset_management: [asset management, asset manager, gestion d'actifs,
      societe de gestion, societe de gestion de portefeuille, gestion de portefeuille,
      portfolio management, opcvm, sicav, fund management, gestion privee,
      multi-family office, wealth management firm]
    investment_bank: [banque d'affaires, investment bank, boutique m&a, m&a boutique,
      conseil en fusions-acquisitions, conseil en fusions et acquisitions,
      fusions-acquisitions, m&a advisory, corporate finance advisory,
      conseil en financement, debt advisory, transaction services]
    bank: [groupe bancaire, banque de financement, banque d'investissement,
      etablissement bancaire, banque privee, private bank, corporate and investment bank]
    insurance: [assureur, compagnie d'assurance, groupe d'assurance, insurance company,
      insurer, reassurance, reinsurance, reassureur, insurtech]
    consulting: [cabinet de conseil, consulting firm, conseil en strategie,
      strategy consulting, management consulting, conseil en management,
      consultancy, advisory firm, conseil en transformation, cabinet de conseil en strategie]
    fintech: [fintech, neobanque, neobank, neo-banque, plateforme de paiement,
      payment platform, solution de paiement, open banking, wealthtech, regtech,
      crypto, blockchain, actifs numeriques, digital assets]
    startup: [start-up, startup, scale-up, scaleup, jeune pousse, serie a, series a,
      serie b, series b, seed round, levee de fonds de, venture-backed, vc-backed,
      station f, hypercroissance, licorne, unicorn, french tech, next40, ft120]

  # ROLE functions, matched on the TITLE (generic titles like "Summer
  # Internship" are judged on the description). Highest score wins.
  # level core = what you want; adjacent = kept but capped (can't rank high).
  functions:
    - key: investment
      label: Investment
      level: core
      score: 92
      keywords: [private equity, venture capital, vc, capital-investissement,
        capital investissement, capital-risque, capital risque, investment,
        investments, investissement, investissements, investor, m&a, fusions,

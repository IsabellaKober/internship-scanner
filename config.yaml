        finance d'entreprise, equity research, recherche actions, asset management,
        gestion d'actifs, gestion d'actif, portfolio, portefeuille, fund, funds,
        fonds d'investissement, deal advisory, deal team, deal origination, transaction services, leveraged finance, ecm, dcm,
        debt advisory, restructuring, investment banking, banque d'affaires,
        financial advisory, venture, ventures, buy-side, sell-side, public equity,
        equities, analyste investissement, investment analyst]
    - key: strategy
